{% extends 'base.html' %}

{% block content %}



    <!-- Posts Section -->
    <section class="w-full md:w-2/3 flex flex-col items-center px-3">

        {% for post in posts %}
            <article class="flex flex-col shadow my-4">
                <!-- Article Image -->
                <a href="{% url 'trip_detail' pk=post.id %}" class="hover:opacity-75">
                    <img src="{{ post.main_picture.url }}" >
                </a>
                <div class="bg-white flex flex-col justify-start p-6">
                    <a href="#" class="text-blue-700 text-sm font-bold uppercase pb-4">{{ post.destination }}</a>
                    <a href="#" class="text-3xl font-bold hover:text-gray-700 pb-4">{{ post.title }}</a>
                    <p href="#" class="text-sm pb-3">
                        Visited {{ post.from_date }} - {{ post.to_date }}
                    </p>
                    <a href="#" class="pb-6">{{ post.intro_text }}</a>
                    <a href="{% url 'trip_detail' pk=post.id %}" class="uppercase text-gray-800 hover:text-black">Continue Reading <i class="fas fa-arrow-right"></i></a>
                </div>
            </article>
        {% endfor %}


    </section>


{% endblock %}
